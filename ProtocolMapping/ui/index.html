<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growatt · Cloud Edge Device Navigation</title>
  <style>
    :root {
      --bg: #050b16;
      --line: rgba(110, 196, 255, 0.26);
      --line-strong: rgba(107, 239, 255, 0.62);
      --text: #edf7ff;
      --muted: #94aeca;
      --cyan: #6befff;
      --blue: #78a7ff;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 84% 16%, rgba(79, 238, 255, 0.14), transparent 24%),
        radial-gradient(circle at 22% 78%, rgba(104, 255, 211, 0.08), transparent 22%),
        linear-gradient(180deg, #061225 0%, #050b16 62%, #030812 100%);
    }

    a { color: inherit; }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      padding: clamp(14px, 2.4vh, 24px) clamp(18px, 4vw, 56px);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 48%, black 0%, transparent 78%);
      pointer-events: none;
    }

    .orb {
      position: absolute;
      width: 520px;
      height: 520px;
      right: -190px;
      top: -170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107, 239, 255, 0.20), rgba(120, 167, 255, 0.05) 46%, transparent 70%);
      filter: blur(2px);
      pointer-events: none;
    }

    .home-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1040px;
      height: min(700px, calc(100vh - clamp(28px, 4.8vh, 48px)));
      min-height: 430px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(14px, 2vh, 20px);
    }

    .home-title {
      margin: 0;
      text-align: center;
      color: #f2fbff;
      font-size: clamp(26px, 3.1vw, 40px);
      line-height: 1.08;
      font-weight: 800;
      text-shadow: 0 0 28px rgba(107,239,255,0.22);
    }

    .visual {
      position: relative;
      width: 100%;
      max-width: none;
      height: 100%;
      min-height: 360px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.095), rgba(255,255,255,0.035)),
        rgba(255,255,255,0.035);
      backdrop-filter: blur(22px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 28px 90px var(--shadow);
      overflow: hidden;
      padding: clamp(16px, 2vw, 24px);
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 2vh, 20px);
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 50%, rgba(107,239,255,0.12), transparent 34%);
      pointer-events: none;
    }

    .spine {
      position: absolute;
      left: 50%;
      top: 64px;
      bottom: 64px;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent, var(--line-strong), rgba(120,167,255,0.75), var(--line-strong), transparent);
      box-shadow: 0 0 24px rgba(107,239,255,0.34);
      z-index: 1;
    }

    .layer-card {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.095);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.035));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.025), 0 18px 40px rgba(0,0,0,0.22);
      display: grid;
      grid-template-columns: 156px 1fr 158px;
      align-items: center;
      overflow: hidden;
      transition: transform .24s ease, border-color .24s ease, background .24s ease;
      z-index: 2;
    }

    .layer-card:hover {
      transform: translateY(-3px);
      border-color: rgba(107,239,255,0.32);
      background: linear-gradient(135deg, rgba(107,239,255,0.105), rgba(255,255,255,0.04));
    }

    .layer-card::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 22px rgba(107,239,255,0.62);
      z-index: 3;
    }

    .layer-head {
      height: 100%;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-right: 1px solid rgba(255,255,255,0.075);
    }

    .layer-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--cyan);
      background: rgba(107,239,255,0.08);
      border: 1px solid rgba(107,239,255,0.18);
    }

    .layer-icon svg { width: 24px; height: 24px; display: block; }

    .layer-cn { font-size: 25px; font-weight: 800; line-height: 1; }

    .layer-mid { padding: 16px 22px; }

    .layer-title { font-size: 15px; font-weight: 700; margin-bottom: 0; }
    .layer-title + .chips { margin-top: 10px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      color: #d8eaff;
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.045);
    }

    .protocol {
      height: 100%;
      border-left: 1px solid rgba(255,255,255,0.075);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .protocol a {
      width: 100%;
      min-height: 66px;
      border: 1px solid rgba(107,239,255,0.18);
      border-radius: 14px;
      background: rgba(107,239,255,0.055);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
      color: #d9f6ff;
      transition: border-color .22s ease, background .22s ease, transform .22s ease;
    }

    .protocol a:hover {
      border-color: rgba(107,239,255,0.48);
      background: rgba(107,239,255,0.12);
      transform: translateY(-1px);
    }

    .reserved {
      width: 100%;
      min-height: 66px;
      border: 1px dashed rgba(148,174,202,0.30);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .reserved b { color: #a9c4dd; font-weight: 600; font-size: 12.5px; }
    .reserved i {
      font-style: normal;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #6f8aa6;
    }

    .locale-switch {
      position: absolute;
      top: clamp(12px, 2vh, 20px);
      right: clamp(14px, 3vw, 42px);
      z-index: 4;
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(14px);
    }

    .locale-switch button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      padding: 7px 10px;
    }

    .locale-switch button.active {
      background: rgba(107,239,255,0.16);
      color: #eafaff;
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .home-shell { height: auto; min-height: auto; }
      .home-title { font-size: 28px; }
      .visual { height: auto; min-height: auto; padding: 18px; display: grid; gap: 14px; }
      .spine { display: none; }
      .layer-card { grid-template-columns: 1fr; min-height: auto; }
      .layer-card::after { display: none; }
      .layer-head, .protocol { border: none; }
      .layer-head { border-bottom: 1px solid rgba(255,255,255,0.075); }
      .protocol { justify-content: flex-start; }
    }

    @media (max-width: 560px) {
      .page { padding: 22px 16px 32px; }
      .home-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="orb"></div>
    <div class="locale-switch" aria-label="Language">
      <button type="button" data-locale="en" class="active">EN</button>
      <button type="button" data-locale="zh">中文</button>
    </div>

    <div class="home-shell">
      <h1 class="home-title" data-i18n="home.title">Growatt Cloud-Edge-Device Unified Protocol</h1>

      <section class="visual" id="architecture">
        <div class="spine"></div>

        <article class="layer-card" id="cloud">
          <div class="layer-head">
            <div class="layer-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 18.5h-11A4.5 4.5 0 0 1 5.9 9.6 6 6 0 0 1 17.7 8.2a4 4 0 0 1-.2 10.3Z" />
              </svg>
            </div>
            <div>
              <div class="layer-cn" data-i18n="cloud.label">Cloud</div>
            </div>
          </div>
          <div class="layer-mid">
            <div class="layer-title" data-i18n="cloud.title">Unified Semantic OPEN API</div>
          </div>
          <div class="protocol">
            <a href="#" data-link-key="cloud.openApi" data-i18n="cloud.link">OPEN API ↗</a>
          </div>
        </article>

        <article class="layer-card" id="edge">
          <div class="layer-head">
            <div class="layer-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="9" width="10" height="7" rx="1.8" />
                <circle cx="4.5" cy="6" r="1.8" />
                <circle cx="19.5" cy="6" r="1.8" />
                <circle cx="12" cy="19.5" r="1.8" />
                <path d="M6 7.2 8.5 9.4M18 7.2l-2.5 2.2M12 16v1.7" />
              </svg>
            </div>
            <div>
              <div class="layer-cn" data-i18n="edge.label">Edge</div>
            </div>
          </div>
          <div class="layer-mid">
            <div class="layer-title" data-i18n="edge.title">Unified System RTU Protocol</div>
            <div class="chips">
              <span class="chip" data-i18n="edge.groHomeManger">GroHomeManger</span>
              <span class="chip" data-i18n="edge.shineMaster">ShineMaster</span>
              <span class="chip" data-i18n="edge.datalogger">Datalogger</span>
            </div>
          </div>
          <div class="protocol">
            <div class="reserved">
              <b data-i18n="edge.reservedTitle">Unified System RTU Protocol</b>
              <i data-i18n="common.reserved">Reserved</i>
            </div>
          </div>
        </article>

        <article class="layer-card" id="device">
          <div class="layer-head">
            <div class="layer-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="7" width="16" height="10" rx="2" />
                <path d="M21 11v2M7 11h4M14 11v2M15 12h-2" />
              </svg>
            </div>
            <div>
              <div class="layer-cn" data-i18n="device.label">Device</div>
            </div>
          </div>
          <div class="layer-mid">
            <div class="layer-title" data-i18n="device.title">Unified Device RTU</div>
            <div class="chips">
              <span class="chip" data-i18n="device.inverter">Inverter</span>
              <span class="chip" data-i18n="device.battery">Battery</span>
              <span class="chip" data-i18n="device.meter">Meter</span>
            </div>
          </div>
          <div class="protocol">
            <a href="#" data-link-key="device.unifiedRtu" data-i18n="device.link">Unified Device RTU ↗</a>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script>
    const LINK_REGISTRY = {
      "cloud.openApi": "/growatt-openapi",
      "device.unifiedRtu": "register_map_visual.html"
    };

    const I18N = {
      en: {
        pageTitle: "Growatt · Cloud Edge Device Navigation",
        "home.title": "Growatt Cloud-Edge-Device Unified Protocol",
        "cloud.label": "Cloud",
        "cloud.title": "Unified Semantic OPEN API",
        "cloud.link": "OPEN API ↗",
        "edge.label": "Edge",
        "edge.title": "Unified System RTU Protocol",
        "edge.groHomeManger": "GroHomeManger",
        "edge.shineMaster": "ShineMaster",
        "edge.datalogger": "Datalogger",
        "edge.reservedTitle": "Unified System RTU Protocol",
        "device.label": "Device",
        "device.title": "Unified Device RTU",
        "device.inverter": "Inverter",
        "device.battery": "Battery",
        "device.meter": "Meter",
        "device.link": "Unified Device RTU ↗",
        "common.reserved": "Reserved"
      },
      zh: {
        pageTitle: "Growatt · 云边端导航",
        "home.title": "Growatt 云边端 统一协议",
        "cloud.label": "云",
        "cloud.title": "统一语义 OPEN API",
        "cloud.link": "OPEN API ↗",
        "edge.label": "边",
        "edge.title": "统一系统 RTU 协议",
        "edge.groHomeManger": "GroHomeManger",
        "edge.shineMaster": "ShineMaster",
        "edge.datalogger": "Datalogger",
        "edge.reservedTitle": "统一系统 RTU 协议",
        "device.label": "端",
        "device.title": "统一设备 RTU",
        "device.inverter": "逆变器",
        "device.battery": "电池",
        "device.meter": "电表",
        "device.link": "统一设备 RTU ↗",
        "common.reserved": "预留"
      }
    };

    function localeFromStorage() {
      try {
        return localStorage.getItem("cloud-edge-device-locale") || "en";
      } catch {
        return "en";
      }
    }

    function setLocale(locale) {
      const nextLocale = I18N[locale] ? locale : "en";
      const dictionary = I18N[nextLocale];
      document.documentElement.lang = nextLocale === "zh" ? "zh-CN" : "en";
      document.title = dictionary.pageTitle;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        if (dictionary[key]) node.textContent = dictionary[key];
      });
      document.querySelectorAll("[data-locale]").forEach((button) => {
        button.classList.toggle("active", button.dataset.locale === nextLocale);
      });
      try {
        localStorage.setItem("cloud-edge-device-locale", nextLocale);
      } catch {
        // Ignore storage failures in embedded or privacy-restricted browsers.
      }
    }

    document.querySelectorAll('[data-link-key]').forEach((node) => {
      const key = node.getAttribute('data-link-key');
      if (LINK_REGISTRY[key]) node.href = LINK_REGISTRY[key];
    });

    document.querySelectorAll("[data-locale]").forEach((button) => {
      button.addEventListener("click", () => setLocale(button.dataset.locale));
    });

    setLocale(localeFromStorage());
  </script>
</body>
</html>
